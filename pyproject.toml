[project]
name = "credit-card-fraud-mlops"
version = "0.1.0"
description = "End-to-end MLOps demo for real-time credit card fraud detection."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
