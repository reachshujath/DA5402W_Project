name: MLOps CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check src api tests scripts airflow/dags
      - run: pytest --cov=fraud_mlops --cov=api --cov-report=term-missing
      - run: dvc dag

  training-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas numpy scikit-learn joblib pyyaml
      - run: python scripts/create_synthetic_data.py creditcard_ci.csv
        env:
          PYTHONPATH: src
      - run: python -m fraud_mlops.training.train --data-path creditcard_ci.csv --no-mlflow
        env:
          PYTHONPATH: src

  container:
    runs-on: ubuntu-latest
    needs: [quality, training-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/credit-card-fraud-api:${{ github.sha }}
